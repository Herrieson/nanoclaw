id: data_round_01_aligned_mix_800_0053
name: inclusive_curriculum_optimization
description: 针对一所多元化小学的课程包采购与个性化调整任务。Agent 需要在第一轮根据复杂的预算、种族分布和教材评价逻辑筛选出最优课程方案并记录决策逻辑；第二轮则需根据突发的新政策（禁令）和学生反馈（负面评价），在不违反第一轮设定的基本框架下，动态调整供应商并重新生成分级教学计划。测试 Agent 的复杂逻辑计算、多文件关联处理以及在无显式 Prompt 提示下对历史决策记录的持久化与遵守能力。
prompts:
- prompts/data_round_01_aligned_mix_800_0053_turn_1.md
- prompts/data_round_01_aligned_mix_800_0053_turn_2.md
environment:
  asset: data_round_01_aligned_mix_800_0053
skills:
  available: null
runtime:
  model: gpt-4o
  mode: interactive
  memory_policy: default
  approval_mode: auto-approve
  max_steps: 50
  temperature: 0.2
  assets:
    turn_1:
    - data_round_01_aligned_mix_800_0053/turn_1
    turn_2:
    - data_round_01_aligned_mix_800_0053/turn_2
sessions:
- turn: 1
  prompt: prompts/data_round_01_aligned_mix_800_0053_turn_1.md
- turn: 2
